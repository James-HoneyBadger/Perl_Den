name: BadgerOps CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl-version: ['5.28', '5.36', '5.38']
    name: Perl ${{ matrix.perl-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}

      - name: Cache CPAN modules
        uses: actions/cache@v4
        with:
          path: ~/perl5
          key: ${{ runner.os }}-perl-${{ matrix.perl-version }}-${{ hashFiles('cpanfile') }}
          restore-keys: |
            ${{ runner.os }}-perl-${{ matrix.perl-version }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libssl-dev libgtk-3-dev libgirepository1.0-dev \
            libglib2.0-dev gir1.2-gtk-3.0 || true

      - name: Install CPAN dependencies
        run: |
          cpanm --local-lib ~/perl5 --no-interactive --skip-satisfied \
            Try::Tiny YAML::XS JSON::MaybeXS File::HomeDir \
            Test::More Test::Exception Test::MockModule Test::Pod \
            Devel::Cover

      - name: Install optional deps (best-effort)
        continue-on-error: true
        run: |
          cpanm --local-lib ~/perl5 --no-interactive \
            Proc::ProcessTable Net::DNS IO::Socket::SSL Text::Diff \
            Perl::Critic Perl::Tidy

      - name: Verify minimum Perl version
        run: perl -e 'use 5.028; print "Perl $] OK\n"'

      - name: Run tests
        run: prove -lr t/
        env:
          PERL5LIB: lib:$HOME/perl5/lib/perl5
          BADGEROPS_DEBUG: 0
          DISPLAY: ''

      - name: Run coverage (latest Perl only)
        if: matrix.perl-version == '5.38'
        run: |
          cover -delete
          HARNESS_PERL_SWITCHES=-MDevel::Cover prove -lr t/
          cover -report text
        env:
          PERL5LIB: lib:$HOME/perl5/lib/perl5
          BADGEROPS_DEBUG: 0
          DISPLAY: ''

      - name: Re-run verbose on failure
        if: failure()
        run: prove -lrv t/
        env:
          PERL5LIB: lib:$HOME/perl5/lib/perl5
          DISPLAY: ''

  lint:
    name: Perl::Critic (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
      - name: Install Perl::Critic
        run: cpanm --no-interactive Perl::Critic
      - name: Lint lib/
        run: perlcritic --severity 4 lib/ || true

