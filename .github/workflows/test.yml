name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl-version: ['5.26', '5.32', '5.38']
    name: Perl ${{ matrix.perl-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Install CPAN dependencies
        run: |
          cpanm --installdeps --notest .
          cpanm --notest Test::More Test::Exception Test::MockModule Devel::Cover

      - name: Run tests
        run: prove -lr t/
        env:
          PERL5LIB: lib

      - name: Run coverage (latest Perl only)
        if: matrix.perl-version == '5.38'
        run: |
          cover -delete
          HARNESS_PERL_SWITCHES=-MDevel::Cover prove -lr t/
          cover -report text
        env:
          PERL5LIB: lib

      - name: Run tests (verbose on failure)
        if: failure()
        run: prove -lrv t/
        env:
          PERL5LIB: lib
