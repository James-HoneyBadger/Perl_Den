<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b5797"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect x="4" y="4" width="120" height="120" rx="20" ry="20" fill="url(#bg)"/>
  <!-- Terminal bracket left -->
  <text x="16" y="82" font-family="monospace" font-size="60" font-weight="bold" fill="#5bc0de">&gt;_</text>
  <!-- HB letters -->
  <text x="36" y="108" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">HB</text>
  <!-- Perl camel silhouette hint - small -->
  <text x="80" y="50" font-family="serif" font-size="36" font-weight="bold" fill="#e8a83e">P</text>
</svg>
